[package]
name = "memchr-n"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Zachary Dremann <dremann@gmail.com>"]
description = "Fast SIMD-accelerated search and iteration over the bytes belonging to an arbitrary set of byte values"
repository = "https://github.com/Dr-Emann/memchr_n"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["memchr", "simd", "search", "bytes", "scan"]
categories = ["algorithms", "text-processing"]

[dependencies]
# Pinned to linebender/fearless_simd#347, which makes `vectorize`'s target-feature function
# `#[inline]`. That removes the entry-point trampoline in `vector::level_scans!` wherever the
# level is the compile target's baseline — all of aarch64, and `sse2` on x86-64. Unpin once
# it is on `main`; nothing here depends on the pin beyond that.
fearless_simd = { git = "https://github.com/linebender/fearless_simd.git", rev = "e953125cb9dc6ecb9bdd088831b0d02d21e602d2" }

[dev-dependencies]
criterion = "0.8"
memchr = "2.8"

[[bench]]
name = "memchr_n"
harness = false

