[changelog]
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/Dr-Emann/memchr_n/issues/$1" },
]
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^security", group = "security" },
    { message = "^ci", skip = true },
    { message = "^chore.*bindings", skip = true },
    { message = "^chore.*cargo update", skip = true },
    { message = "^chore.*update dep", skip = true },
    { message = "^chore(\\(.*\\))?: release", skip = true },
    { message = "^.*", group = "other" },
]
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | upper_first }}
    {% for commit in commits %}
        {%- if commit.scope -%}
            - *({{commit.scope}})*\
        {% else -%}
            -\
        {% endif %} {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}{{ self::username(commit=commit) }}{{ self::pr(commit=commit) }}{{ self::links(commit=commit) }}
    {% endfor -%}
{% endfor %}
{%- macro username(commit) -%}
    {% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif -%}
{% endmacro -%}
{%- macro pr(commit) -%}
    {% if commit.remote.pr_number and "/pull/" not in commit.message and "(#" not in commit.message %} - #{{ commit.remote.pr_number }}{% endif -%}
{% endmacro -%}
{%- macro links(commit) -%}
    {% for link in commit.links | unique(attribute="href") -%}
        {% if commit.remote.pr_number and link.text | trim_start_matches(pat="#") | int == commit.remote.pr_number -%}
        {% elif link.href | replace(from="/issues/", to="/pull/") in commit.message -%}
        {% elif link.href not in commit.message %} [{{ link.text }}]({{ link.href }}){% endif -%}
    {% endfor -%}
{% endmacro -%}
"""
